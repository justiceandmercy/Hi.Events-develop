# Netlify Configuration for Hi.Events Frontend
# Deploy: Connect GitHub repo → Base Directory: frontend
# Build Command: yarn install && yarn build
# Publish Directory: dist/client

[build]
  command = "yarn install && yarn build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "20"
  YARN_VERSION = "1.22.22"

# Environment variables (set in Netlify dashboard)
# VITE_API_URL_CLIENT=https://your-backend.railway.app
# VITE_API_URL_SERVER=https://your-backend.railway.app
# VITE_FRONTEND_URL=https://your-site.netlify.app
# VITE_STRIPE_PUBLISHABLE_KEY=pk_live_...
# VITE_APP_NAME=Hi.Events
# VITE_APP_LOGO_DARK=
# VITE_APP_FAVICON=/favicon.svg

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  conditions = {Role = ["admin", "user"]}

# SPA fallback for client-side routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/manifest-icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/logos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Service Worker (if using)
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

# API proxy for development (optional - remove for production)
# [[redirects]]
#   from = "/api/*"
#   to = "https://your-backend.railway.app/api/:splat"
#   status = 200
#   force = true